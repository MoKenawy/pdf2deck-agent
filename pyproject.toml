[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pdf2deck-agent"
version = "0.1.0"
description = "Production-oriented MVP for transforming PDF chapters into styled PowerPoint decks with LangGraph."
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.0,<2.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "langfuse>=4.0,<5.0",
  "gradio>=5.0,<7.0",
  "pypdf>=5.0,<7.0",
  "python-pptx>=1.0,<2.0",
  "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "mypy>=1.14,<2.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
pdf2deck = "pdf2deck.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2deck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
